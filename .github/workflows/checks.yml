name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  disposable-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker compose run --build --rm checks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-window
          path: tests/artifacts/compose/ui.png
