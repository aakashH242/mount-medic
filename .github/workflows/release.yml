name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: mount-medic-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Test the tagged source
        run: docker compose run --build --rm --cap-add=CHOWN --cap-add=SETUID --cap-add=SETGID --cap-add=DAC_OVERRIDE --cap-add=FOWNER -e MM_UPDATE_INSTALL_SMOKE=1 checks
      - name: Generate release assets
        run: python3 scripts/release.py --tag "$GITHUB_REF_NAME"
      - name: Upload to a draft and publish together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = true || { echo 'Refusing to replace a published release' >&2; exit 1; }
            gh release upload "$GITHUB_REF_NAME" dist/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --draft --generate-notes --title "Mount Medic $GITHUB_REF_NAME"
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
