<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root"><allow own="io.github.aakashH242.MountMedic"/></policy>
  <policy context="default">
    <allow send_destination="io.github.aakashH242.MountMedic" send_interface="io.github.aakashH242.MountMedic1"/>
    <allow send_destination="io.github.aakashH242.MountMedic" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
